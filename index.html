<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Kage Rogue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <header class="game-header" style="text-align: center; color: #fff; padding: 10px; font-family: 'Outfit', sans-serif;">
      <h1 style="margin: 0; font-size: 1.5rem; letter-spacing: 2px;">SHADOW KAGE ROGUE</h1>
      <p style="margin: 4px 0 0; font-size: 0.9rem; opacity: 0.8;">Infiltración y Sigilo Táctico 2D (WASD: Mover | Q: Humo | E: Señuelo | 1: Shuriken)</p>
    </header>
    <canvas id="game-canvas" width="960" height="640"></canvas>

    <div id="hud">
      <div class="hud-section">
        <div class="hud-label">SIGILO</div>
        <div class="hud-bar" id="stealth-bar">
          <div class="hud-bar-fill" id="stealth-fill"></div>
        </div>
      </div>
      <div class="hud-section">
        <div class="hud-label">RUIDO</div>
        <div class="hud-bar" id="noise-bar">
          <div class="hud-bar-fill" id="noise-fill"></div>
        </div>
      </div>
      <div class="hud-section">
        <div class="hud-label">HERRAMIENTAS</div>
        <div class="hud-tools" id="tools-display">
          <span class="tool-slot" data-tool="shuriken">🌀 Shuriken</span>
          <span class="tool-slot" data-tool="smoke">💨 Bomba Humo</span>
          <span class="tool-slot" data-tool="grappling">🪢 Garfio</span>
          <span class="tool-slot" data-tool="decoy">🎵 Señuelo</span>
        </div>
      </div>
    </div>

    <div id="message" class="message-box"></div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/raycast.js"></script>
  <script src="js/player.js"></script>
  <script src="js/guards.js"></script>
  <script src="js/gadgets.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
